<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Community Data Center — AI Labz Ltd is raising £400,000 so universities, small businesses and independent researchers can own the GPU infrastructure they use, as a co-operative, in Scotland." />
    <title>Community Data Center | AI Labz Ltd</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Static form so Netlify's build-time bot can detect and provision this form. -->
    <form name="register-interest" data-netlify="true" netlify-honeypot="company-website" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="text" name="organisation" />
      <input type="text" name="organisationType" />
      <input type="text" name="amount" />
      <textarea name="message"></textarea>
      <input type="text" name="company-website" />
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
